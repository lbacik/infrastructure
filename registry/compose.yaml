networks:
    default:
        name: "${NETWORK}"
        external: true

volumes:
  registry-data:

services:
  registry:
    image: registry:2
    restart: "${RESTART:-no}"
    volumes:
      - "registry-data:/var/lib/registry"
    environment:
      # the UI below ships with DELETE_IMAGES=true; without this the registry
      # API answers its DELETE calls with 405
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      # nginx-proxy ignores an empty VIRTUAL_HOST, so hosts that keep the
      # registry inside the docker network just leave REGISTRY_DOMAIN unset
      - VIRTUAL_HOST=${REGISTRY_DOMAIN:-}
      - VIRTUAL_PORT=5000
      - LETSENCRYPT_HOST=${REGISTRY_LETSENCRYPT_HOST:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    # ports:
    #   - "${HOST_IP}:5000:5000"

  registry-ui:
    image: joxit/docker-registry-ui:main
    restart: "${RESTART:-no}"
    # ports:
    #   - "${HOST_IP}:8080:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Docker Registry UI
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=http://registry:5000
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
      - REGISTRY_SECURED=${REGISTRY_SECURED:-false}
      - CATALOG_ELEMENTS_LIMIT=1000
      - VIRTUAL_HOST=${UI_DOMAIN:-}
      - LETSENCRYPT_HOST=${UI_LETSENCRYPT_HOST:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    container_name: registry-ui
