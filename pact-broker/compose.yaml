networks:
  default:
    name: "${NETWORK}"
    external: true

services:
  pact-broker:
    image: "pactfoundation/pact-broker:${PACT_BROKER_VERSION}"
    restart: "${RESTART}"
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: "${PACT_BROKER_DATABASE_HOST}"
      PACT_BROKER_DATABASE_PORT: "${PACT_BROKER_DATABASE_PORT}"
      PACT_BROKER_DATABASE_NAME: "${PACT_BROKER_DATABASE_NAME}"
      PACT_BROKER_DATABASE_USERNAME: "${PACT_BROKER_DATABASE_USERNAME}"
      PACT_BROKER_DATABASE_PASSWORD: "${PACT_BROKER_DATABASE_PASSWORD}"
      PACT_BROKER_DATABASE_SSLMODE: disable
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: "10"
      PACT_BROKER_BASE_URL: "${PACT_BROKER_BASE_URL}"
      PACT_BROKER_BASIC_AUTH_USERNAME: "${PACT_BROKER_USERNAME}"
      PACT_BROKER_BASIC_AUTH_PASSWORD: "${PACT_BROKER_PASSWORD}"
      PACT_BROKER_BASIC_AUTH_READ_ONLY_USERNAME: "${PACT_BROKER_READ_ONLY_USERNAME}"
      PACT_BROKER_BASIC_AUTH_READ_ONLY_PASSWORD: "${PACT_BROKER_READ_ONLY_PASSWORD}"
      PACT_BROKER_PUBLIC_HEARTBEAT: "true"
      VIRTUAL_HOST: "${PACT_BROKER_DOMAIN}"
      VIRTUAL_PORT: "9292"
      LETSENCRYPT_HOST: "${PACT_BROKER_DOMAIN}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:9292/diagnostic/status/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
