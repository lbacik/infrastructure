# LiteLLM proxy routes. Clients send Anthropic Messages requests to
# /v1/messages; `openai/` deployments are translated to the OpenAI Responses
# API. For Claude Code clients LiteLLM derives `prompt_cache_key` from the
# session_id in metadata.user_id, which Meta needs for prompt-cache affinity
# (its own /v1/messages endpoint rejects `prompt_cache_key`).
#
# model_name must match the model the client requests.
model_list:
  - model_name: muse-spark-1.3-contributor
    litellm_params:
      model: openai/muse-spark-1.3-contributor
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_API_KEY

litellm_settings:
  # Drop Anthropic-only parameters the Responses API cannot express instead of
  # failing the request.
  drop_params: true
