# version: '3.1'

networks:
  default:
    name: "${NETWORK}"
    external: true

volumes:
  mongo-backups:

services:
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${PASS}"
    ports:
      - ${HOST_IP}:27017:27017
    # volumes:
    #   - "${BACKUP}:/backups"
    networks:
      default:
        aliases:
          - "${FULL_HOSTNAME_DB}"

  mongo-express:
    image: mongo-express
    ports:
      - "${HOST_IP}:27080:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "${USER}"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${PASS}"
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: "${BASICAUTH_USERNAME}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${BASICAUTH_PASSWORD}"
      # VIRTUAL_HOST: "${EXPRESS_URL}"
      # VIRTUAL_PORT: 8081
      # LETSENCRYPT_HOST: "${EXPRESS_URL}"

