log-queries=extra
log-facility=-

# addn-hosts=/usr/local/etc/dnsmasq/hosts
# resolv-file=/usr/local/etc/dnsmasq/resolv.conf

# Authoritative zones (auth-server, auth-zone, host-record, cname) are
# rendered per environment by entrypoint.sh from ZONES, DOMAIN, HOST_IP and
# SOA_SERIAL. Each zone needs a public delegation:
# <zone> NS <DOMAIN>
# <DOMAIN> A <HOST_IP>

# The former configuration used address=/domain/ip and local=/domain/;
# those capabilities still need to be investigated.

# listen-address=0.0.0.0 does not work correctly on this dnsmasq version (2.91,
# images latest/2.90-r3) - the wildcard bind hits a bug that silently drops
# ALL queries (even from 127.0.0.1). interface= works correctly.
interface=eth0

# address=/#/ is affected by the same bug and does not work (foreign domains
# are still forwarded despite this entry). no-resolv disables forwarding
# entirely (foreign domains get REFUSED), regardless of that bug.
no-resolv
no-hosts
no-poll

# caa-record=domain,0,issue,letsencrypt.org
