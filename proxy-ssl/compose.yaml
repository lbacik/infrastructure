# version: '3.9'

networks:
  default:
    name: "${NETWORK}"
    external: true

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme:

services:
  proxy:
    image: nginxproxy/nginx-proxy
    container_name: "${COMPOSE_PROJECT_NAME}-proxy"
    ports:
      - "${HOST_IP}:${PROXY_HTTP_PORT}:80/tcp"
      - "${HOST_IP}:${PROXY_HTTPS_PORT}:443/tcp"
    volumes:
      - "${DOCKER_SOCKET}:/tmp/docker.sock:ro"
      - "nginx-certs:/etc/nginx/certs:ro"
      - "nginx-vhost:/etc/nginx/vhost.d"
      - "nginx-html:/usr/share/nginx/html"
    labels:
      # a single fileset on purpose - per-stream filesets break hints-based
      # collection in Filebeat 9.x (see filebeat/compose.yaml)
      co.elastic.logs/module: nginx
      co.elastic.logs/fileset: access
    # networks:
    #   default:
    #     ipv4_address: "${PROXY_IP}"

  acme:
    image: nginxproxy/acme-companion
    container_name: "${COMPOSE_PROJECT_NAME}-acme"
    volumes:
      - "${DOCKER_SOCKET}:/var/run/docker.sock:ro"
      - "nginx-certs:/etc/nginx/certs"
      - "nginx-vhost:/etc/nginx/vhost.d"
      - "nginx-html:/usr/share/nginx/html"
      - "acme:/etc/acme.sh"
    environment:
      NGINX_PROXY_CONTAINER: "${COMPOSE_PROJECT_NAME}-proxy"
      DEFAULT_EMAIL: "${EMAIL}"

